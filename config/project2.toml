# PGE 385K Homework Project No. 2: shaly-sandstone interpretation with grain-coating clay.
# Depths are in ft. Data paths and the temperature model are in project2/explore.py.

[archie]
a = 1.0
m = 2.1
n = 1.95

[matrix]
rho_ma = 2.65                # g/cc, quartz
dt_ma = 55.5                 # us/ft, quartz (Wyllie)
dt_f = 189.0                 # us/ft, water (Wyllie)
rho_filtrate = 1.0           # g/cc

[shale]
# Reference shales. Sands above `boundary` use the upper shale, sands below it the middle shale.
upper = [5400.0, 5500.0]
middle = [5885.0, 5985.0]
boundary = 5885.0
# Book eq. 10.15.11: phi_sh = alpha*phiD_sh + (1 - alpha)*phiN_sh. alpha = 1 takes the density
# porosity, because the shale neutron also responds to hydroxyl in the clay structure.
alpha = 1.0

[csh]
# Shale index from GR, then a relation from book §8.5 ("auto" would pick the best match to the neutron-density
# Csh in the water sandstones). That check cannot separate the relations here (RMS within 0.01), so the
# relation is chosen by geology: the Oficina sandstones are Tertiary (Miocene).
method = "larionov_tertiary"

[beds]
gr_gradient = 10.0           # API/ft, bed boundary where the smoothed GR gradient peaks above this
rho_gradient = 0.05          # g/cc per ft, same for ZDEN
min_thickness_ft = 3.0
edge_ft = 1.0                # bed-center samples are at least this far from a boundary

[water_sands]
max_vsh = 0.12               # GR index limit for clean samples used to calibrate Rw
edge_ft = 1.5                # stay this far inside the sand (bed-center readings)
min_samples = 8              # minimum clean samples for a sand to be used

[juhasz]
fit_max_sb = 0.20           # fit the water-sand normalization only below this Sb; shalier samples act laminated

[net]
max_vsh = 0.40               # GR index limit for net reservoir in hydrocarbon columns

[sensitivity]
fraction = 0.10              # one-at-a-time perturbation of each input

[permeability]
n_classes = 4                # Leverett fairways with equal numbers of plugs
stress = "3500"              # confining pressure of the core data used: "800" or "3500"
max_sw = 0.99                # keep log(1 - Sw) finite
good_rock_phi = 0.25         # core porosity limit for the good-rock correlation check

[inversion]
# Monte Carlo inversion for (phi_s, Sws, Sxos) per depth; Csh from GR. Means/standard deviations.
realizations = 200
chunk = 50                   # realizations solved together (memory control)
seed = 385
iterations = 40
sigma_rhob = 0.02            # g/cc
sigma_nphi = 0.025           # v/v
sigma_log_rt = 0.05          # natural-log units
sigma_log_rxo = 0.20
use_rxo = false              # class setup: data RHOB, NPHI, Rt. RSFL is not fully flushed in the water sandstones
phi_prior = [0.25, 0.15]     # weak priors, only active where the data do not decide
sw_prior = [0.5, 0.5]
sxo_prior = [0.75, 0.5]
rho_h = [0.75, 0.12]         # g/cc, liquid hydrocarbon (no crossover; no pressure data)
hi_h = [0.95, 0.08]
rho_mf = [1.0, 0.01]         # g/cc, polymer water-based mud filtrate
rho_ma = [2.65, 0.01]        # g/cc
shale_shift = [0.03, 0.03]   # sd of shifts to the shale density (g/cc) and neutron (v/v)
alpha = [0.5, 1.0]           # uniform range of the shale-porosity weight (book eq. 10.15.11)
m = [2.1, 0.05]
n = [1.95, 0.05]
rmf_log_sd = 0.10
surface_temp_sd = 8.0        # degF
b_log_sd = 0.30
gr_endpoint_sd = 5.0         # API
