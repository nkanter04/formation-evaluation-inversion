# PGE 385K Homework Project No. 1: shaly-sandstone (laminated) interpretation.
# Depths are measured depth (MD) in ft unless stated otherwise.
# Any end-point set to "auto" is estimated from the zones below.

[data]
las = "C:/Users/nkant/OneDrive/The University of Texas at Austin/Fall 2026/PGE 385K - Adv. Formation Eval/PGE 385K - Homework Problems/Homework Projects/Homework Project No. 1/LASOut_ALL_W18.las"
pressures = "C:/Users/nkant/OneDrive/The University of Texas at Austin/Fall 2026/PGE 385K - Adv. Formation Eval/PGE 385K - Homework Problems/Homework Projects/Homework Project No. 1/LAS_pressures.las"
top = 9600.0
bottom = 10200.0
output_dir = "outputs/project1"
rhrv_trim_ft = 4.0           # blank Rh/Rv this close to the ends of that log (tool start-up)

# LAS mnemonic for each standard curve name used by the program.
[curves]
GR = "GR"
RHOB = "RHOZ"
NPHI = "TNPH"          # thermal neutron porosity, limestone units
PE = "PE"
DRHO = "DRHO"
CALI = "CALI"
RH = "RH72H_1D_FLT"    # resistivity parallel to bedding (horizontal)
RV = "RV72H_1D_FLT"    # resistivity perpendicular to bedding (vertical)
RXO = "AT10"           # shallowest induction, used as flushed-zone resistivity
RT = "AT90"            # deepest induction
POTA = "POTA"
THOR = "HTHO"
URAN = "HURA"
CGR = "HCGR"           # computed (uranium-free) GR from thorium + potassium
SDEV = "SDEV"
HAZI = "HAZI"
CORE_POR = "COREPOR"
CORE_PERM = "COREPERM"
CORE_SW = "CORESW"
CORE_SO = "CORESO"
CORE_RHOG = "CORERHOG"

[zones]
water = [10045.0, 10125.0]   # water-bearing sand: Rw and Rmf calibration
clean_sand_gr_percentile = 3 # GR percentile taken as clean sand
max_drho = 0.05              # |DRHO| above this flags bad density data
representative_plug_max_rhog = 2.70  # plugs with heavier grain density likely contain clay

# Three sections bracketed by GR trend. Sections 1 and 2 are fining-upward cycles
# (GR falls downward); section 3 has the opposite trend (GR rises to the base shale).
# Each section gets its own pure-shale reference: "auto" = thickest shale bed in the
# section, or give an interval such as [10160.0, 10200.0]. Its Rh and Rv start the
# shale-resistivity bracketing; its GR, RHOB and NPHI are the shale end-points.
[[sections]]
name = "Section 1"
top = 9600.0
bottom = 9825.0
reference = "auto"

[[sections]]
name = "Section 2"
top = 9825.0
bottom = 10080.0
# Section 2 has no pure shale (its high-thorium beds read GR 74-84, NPHI 0.35-0.39),
# so it borrows the nearest thick shale. Tested against 4 alternatives: lowest porosity
# bias vs. core and best data fit; see the commit message for the comparison.
reference = [9654.0, 9690.0]

[[sections]]
name = "Section 3"
top = 10080.0
bottom = 10200.0
reference = "auto"

# Bed boundaries and thick-bed center points. Readings near boundaries average both
# beds, so calibration and cross-checks use only centers of thick beds.
[beds]
rv_log10_gradient = 0.10     # boundary where |d log10(Rv)/dz| peaks above this (per ft)
thor_gradient = 1.2          # or where |d Th/dz| peaks above this (ppm per ft)
smooth_ft = 0.75             # smoothing before differentiating
min_spacing_ft = 1.0         # boundaries closer than this are merged
min_thickness_ft = 3.0       # thinner beds are not used for calibration
edge_ft = 1.0                # samples this close to a boundary are not centers

# Shale-resistivity bracketing in each section (thick-bed centers only).
[bracketing]
factor_min = 0.6             # scan Rsh_h and Rsh_v from 0.6x to 1.6x the shale bed's readings
factor_max = 1.6
steps = 13
sand_max = 0.1               # inversion Csh at or below this marks clean sand
shale_min = 0.9              # at or above this marks pure shale
min_points = 5               # fewer sand/shale points: fall back to GR percentiles
shale_penalty = 2.0          # penalty when the reference shale reads Csh below shale_min
fit_weight = 0.05            # penalty per noise unit (above 1) that Rsh moves away from the shale bed readings
min_span_fraction = 0.25     # sand and shale spectral GR must differ by this share of its range

# Uranium is not tied to clay, so where it is high the GR over-reads Csh.
[uranium]
u_max_ppm = "auto"           # abnormal uranium above this; "auto" = median + k * MAD
u_mad_k = 3.0
max_csh_inflation = 0.15     # flag where Csh(GR) - Csh(uranium-free CGR) exceeds this
min_interval_ft = 0.5        # shorter flagged runs are ignored
merge_gap_ft = 1.0           # flagged runs closer than this are merged

[archie]
a = 1.0
m = 2.3
n = 1.97

# Matrix and fluid properties. Each entry is [mean, standard deviation].
# Resistivities use a relative (fractional) standard deviation.
[properties]
rho_ma = [2.65, 0.01]        # g/cc, quartz
nphi_ma = [-0.035, 0.01]     # apparent neutron of quartz in limestone units
rho_w = [1.05, 0.02]         # g/cc, formation water
rho_hc = ["auto", 0.08]      # g/cc, "auto" = from pressure gradient
hi_hc = [0.9, 0.1]           # hydrogen index of hydrocarbon
rw = ["auto", 0.15]          # ohm.m at formation temperature (relative std)
rmf = ["auto", 0.20]         # ohm.m (relative std)

# Shale and clean-sand end-points: "auto" = estimated per section (reference shale
# and bracketing). A number instead of "auto" applies to every section. Each Monte
# Carlo realization shifts all sections by the same draw from the standard deviation.
[endpoints]
gr_sand = ["auto", 4.0]
gr_shale = ["auto", 6.0]
rho_sh = ["auto", 0.03]      # wide: covers 2.33-2.39 g/cc seen across the well's shales
nphi_sh = ["auto", 0.02]
rsh_h = ["auto", 0.10]       # relative std
rsh_v = ["auto", 0.15]       # relative std
phi_sh = ["auto", 0.02]      # density porosity of shale laminae (Thomas-Stieber shale point)
spec_sand = ["auto", 0.6]    # spectral GR at Csh = 0, units of csh_spectral_curve (ppm for THOR)
spec_shale = ["auto", 0.8]   # spectral GR at Csh = 1

[pressure]
hc_interval = [9725.0, 9890.0]   # points used for the hydrocarbon gradient
water_interval = [10040.0, 10080.0]

[inversion]
method = "sequential"        # "sequential": Csh-Rss from Rh/Rv, then porosity-Sw; "joint": all at once
csh_spectral_curve = "THOR"  # uranium-free Csh bias: THOR, POTA or CGR (GR includes uranium)
realizations = 1000
seed = 385
chunk = 25                 # realizations per parallel job (memory control)
workers = 0                # parallel processes, 0 = all CPU cores but one, 1 = serial
screen_iterations = 12     # short solves from two starting Sw values
iterations = 30            # refinement of the better start
csh_prior_std = 0.15       # trust in the spectral-GR Csh used to bias the inversion
phi_prior = [0.25, 0.12]   # weak prior on sand porosity
sw_prior = [0.6, 0.5]      # weak prior on sand water saturation
sigma_log_rh = 0.05        # Rh measurement error (natural-log units, ~5%)
sigma_log_rv = 0.10        # Rv is noisier than Rh (fewer coils), ~10%
sigma_log_rss = 0.10       # step 2: misfit allowed between Archie and step-1 Rss
sigma_rhob = 0.02          # g/cc
sigma_nphi = 0.025         # v/v
shale_mask = 0.95          # sand properties are undefined above this Csh

# PGE 358 HW 6 point-by-point HPV (python -m fe_inversion.manual_hpv).
# Equations: docs/manual_hpv_method.md. Uses the [archie] parameters above.
[manual_hpv]
interval = [9825.0, 10080.0]         # Section 2
shale_point = [9654.0, 9690.0]       # pure shale: GR, density and neutron porosity (median). The
                                     # upper shale (phiD 0.187) rather than the base shale (0.155): the
                                     # base shale's low density porosity overcorrected phi_s by ~0.09
aquifer = [10065.0, 10080.0]         # water sandstone, Sw = 1 (median)
rsh = 0.89                           # parallel shale resistivity (ohm.m), or "shale_point" for the
                                     # shale point's own Rt. 0.89 = RH of high-GR bed centers in the
                                     # pay; the base shale's 0.60 leaves Rs undefined at 98% of the pay
csh_method = "larionov"              # "linear" (HW 6 as given) or "larionov" (Tertiary)
porosity_method = "oil_density"      # "hw6": RMS/average of corrected density and neutron;
                                     # "oil_density": corrected density re-solved with
                                     # rho_f = Sw*rho_w + (1-Sw)*rho_hc, iterated with Sw
rho_ma = 2.65                        # g/cc, quartz
rho_w = 1.05                         # g/cc, formation water
rho_hc = 0.644                       # g/cc, oil, from the formation-pressure gradient
rt_curve = "RH"                      # resistivity parallel to bedding
density_porosity_curve = "PHID_SS"   # sandstone density porosity (2.65 / 1.0 g/cc)
neutron_offset = 0.0                 # added to TNPH; 0 = treat TNPH as sandstone units
clip_aquifer_csh = true              # negative aquifer N-D Csh (residual gas) -> 0
shale_cutoff = 0.95                  # no HPV where Csh is at or above this
